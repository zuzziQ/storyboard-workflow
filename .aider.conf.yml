# Aider configuration file (Auto-generated by sync-docs.js)
model: gemini/gemini-1.5-pro

# Automatically read ecosystem rules and contexts
read:
  - .agents/rules/zuzzi.md

# Disable auto commits to allow testing before committing
auto-commits: false

# Skip update check for faster startup
skip-check-update: true

# Exclude heavy or irrelevant folders
exclude:
  - "node_modules/**"
  - ".next/**"
  - "dist/**"
  - "build/**"
  - "brain/**"
  - ".git/**"
  - ".aider*"
